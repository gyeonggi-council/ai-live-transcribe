# Oracle Cloud Always Free 배포 스택
#
# 구성:
# - api: FastAPI 백엔드 (내부 포트 8000)
# - nginx: 리버스 프록시 + SSL 종단 (80, 443)
# - certbot: Let's Encrypt 인증서 발급 및 갱신
#
# 사용:
#   cd /opt/ggc-subtitle
#   docker compose up -d       # 기동
#   docker compose logs -f api  # 로그 확인
#   docker compose pull && docker compose up -d  # 업데이트
#
# 최초 배포 후 SSL 발급은 deploy/scripts/init-ssl.sh 실행

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ggc-subtitle-backend:latest
    container_name: ggc-api
    restart: unless-stopped
    # 외부 노출 없이 내부 네트워크에서만 접근 (nginx가 프록시)
    expose:
      - "8000"
    env_file:
      - ../backend/.env
    volumes:
      # 업로드 파일은 호스트에 영속화
      - /var/ggc-data/uploads:/app/uploads
    networks:
      - ggc-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 로그 순환 (디스크 보호)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: ggc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - ggc-net
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: ggc-certbot
    # 12시간마다 갱신 시도 (Let's Encrypt 권장)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    restart: unless-stopped
    depends_on:
      - nginx

networks:
  ggc-net:
    driver: bridge
