# Domain Resources v2.0
# 경기도의회 실시간 자막 서비스

version: "2.0"

resources:
  # ============================================
  # meetings - 회의 정보
  # ============================================
  meetings:
    description: 회의 정보 (실시간/VOD)
    endpoints:
      - method: GET
        path: /api/meetings
        description: 회의 목록 조회
        params:
          status: { type: string, enum: [scheduled, live, processing, ended] }
          limit: { type: integer, default: 10 }
          offset: { type: integer, default: 0 }
      - method: GET
        path: /api/meetings/live
        description: 현재 실시간 회의 조회
      - method: GET
        path: /api/meetings/{id}
        description: 회의 상세 조회
      - method: POST
        path: /api/meetings
        description: VOD 회의 등록
    fields:
      id: { type: uuid, required: true }
      title: { type: string, required: true, max_length: 255 }
      meeting_date: { type: date, required: true }
      stream_url: { type: string, nullable: true }
      vod_url: { type: string, nullable: true }
      status: { type: string, enum: [scheduled, live, processing, ended], default: scheduled }
      duration_seconds: { type: integer, nullable: true }
      created_at: { type: datetime }
      updated_at: { type: datetime }

  # ============================================
  # subtitles - 자막 데이터
  # ============================================
  subtitles:
    description: 자막 텍스트 및 타임스탬프
    endpoints:
      - method: GET
        path: /api/meetings/{meeting_id}/subtitles
        description: 회의별 자막 목록
        params:
          limit: { type: integer, default: 100 }
          offset: { type: integer, default: 0 }
      - method: GET
        path: /api/meetings/{meeting_id}/subtitles/search
        description: 자막 내 키워드 검색
        params:
          q: { type: string, required: true }
      - method: WS
        path: /ws/meetings/{meeting_id}/subtitles
        description: 실시간 자막 WebSocket
    fields:
      id: { type: uuid, required: true }
      meeting_id: { type: uuid, required: true, ref: meetings }
      start_time: { type: float, required: true, description: "시작 시간 (초)" }
      end_time: { type: float, required: true, description: "종료 시간 (초)" }
      text: { type: string, required: true }
      speaker: { type: string, nullable: true }
      confidence: { type: float, nullable: true, min: 0, max: 1 }
      created_at: { type: datetime }

  # ============================================
  # councilors - 의원 명단 (Whisper prompt용)
  # ============================================
  councilors:
    description: 의원 명단 (Whisper 프롬프트 및 화자 식별용)
    endpoints:
      - method: GET
        path: /api/councilors
        description: 의원 목록 조회
        params:
          term: { type: integer }
          is_active: { type: boolean, default: true }
    fields:
      id: { type: uuid, required: true }
      name: { type: string, required: true, max_length: 100 }
      party: { type: string, nullable: true, max_length: 100 }
      district: { type: string, nullable: true, max_length: 200 }
      term: { type: integer, nullable: true }
      is_active: { type: boolean, default: true }

  # ============================================
  # dictionary - 용어 교정 사전
  # ============================================
  dictionary:
    description: 의회 용어 교정 사전 (Whisper 후처리용)
    endpoints:
      - method: GET
        path: /api/dictionary
        description: 교정 사전 조회
        params:
          category: { type: string }
    fields:
      id: { type: uuid, required: true }
      wrong_text: { type: string, required: true, max_length: 200 }
      correct_text: { type: string, required: true, max_length: 200 }
      category: { type: string, nullable: true, enum: [councilor, term, general] }
      created_at: { type: datetime }

  # ============================================
  # users - 사용자 인증/권한 (Phase 11)
  # ============================================
  users:
    description: 시스템 사용자 및 역할 관리
    endpoints:
      - method: POST
        path: /api/auth/login
        description: 로그인 (JWT 발급)
      - method: POST
        path: /api/auth/logout
        description: 로그아웃
      - method: GET
        path: /api/auth/me
        description: 현재 사용자 정보
      - method: GET
        path: /api/admin/users
        description: 사용자 목록 (관리자)
    fields:
      id: { type: uuid, required: true }
      username: { type: string, required: true, max_length: 50 }
      display_name: { type: string, required: true, max_length: 100 }
      role: { type: string, required: true, enum: [anonymous, staff, committee_staff, meeting_manager, stenographer, admin] }
      assigned_committee: { type: string, nullable: true, description: "소관 위원회 (committee_staff용)" }
      is_active: { type: boolean, default: true }
      last_login_at: { type: datetime, nullable: true }
      created_at: { type: datetime }

  # ============================================
  # ai_conversations - AI 대화 이력 (Phase 11)
  # ============================================
  ai_conversations:
    description: AI 어시스턴트 대화 이력
    endpoints:
      - method: POST
        path: /api/ai/chat
        description: AI Q&A 질문 (RAG 기반)
      - method: POST
        path: /api/ai/summary
        description: 회의 AI 요약 생성
      - method: GET
        path: /api/ai/conversations
        description: 대화 세션 목록 (로그인 시)
      - method: GET
        path: /api/ai/conversations/{session_id}
        description: 세션별 대화 이력
    fields:
      id: { type: uuid, required: true }
      session_id: { type: uuid, required: true }
      user_id: { type: uuid, nullable: true, ref: users }
      role: { type: string, enum: [user, assistant] }
      content: { type: text, required: true }
      sources: { type: json, nullable: true, description: "참조 문서 ID 목록" }
      meeting_context_id: { type: uuid, nullable: true, ref: meetings }
      created_at: { type: datetime }

  # ============================================
  # stenography_records - 속기록 (기존, 필드 보강)
  # ============================================
  stenography_records:
    description: 속기록 레코드 및 라인
    endpoints:
      - method: GET
        path: /api/meetings/{meeting_id}/stenography
        description: 속기록 목록
      - method: POST
        path: /api/meetings/{meeting_id}/stenography
        description: 속기록 등록
      - method: PATCH
        path: /api/meetings/{meeting_id}/stenography/{record_id}
        description: 속기록 수정
      - method: GET
        path: /api/meetings/{meeting_id}/stenography/{record_id}/lines
        description: 속기록 라인 목록
      - method: PATCH
        path: /api/meetings/{meeting_id}/stenography/{record_id}/lines
        description: 라인 일괄 수정
    fields:
      id: { type: uuid, required: true }
      meeting_id: { type: uuid, required: true, ref: meetings }
      stenographer_name: { type: string, nullable: true }
      status: { type: string, enum: [draft, submitted, approved], default: draft }
      created_at: { type: datetime }
      updated_at: { type: datetime }

  # ============================================
  # stenography_lines - 속기록 라인 (Phase 10+11)
  # ============================================
  stenography_lines:
    description: 속기록 개별 라인 (텍스트, 화자, 타임스탬프)
    fields:
      id: { type: uuid, required: true }
      record_id: { type: uuid, required: true, ref: stenography_records }
      sequence_no: { type: integer, required: true }
      text: { type: text, required: true }
      speaker: { type: string, nullable: true }
      start_ms: { type: integer, nullable: true }
      end_ms: { type: integer, nullable: true }
      starts_new_paragraph: { type: boolean, default: false }

  # ============================================
  # stenography_edit_history - 속기 수정 이력 (Phase 11)
  # ============================================
  stenography_edit_history:
    description: 속기록 라인 수정 이력 (diff 추적)
    endpoints:
      - method: GET
        path: /api/meetings/{meeting_id}/stenography/{record_id}/history
        description: 수정 이력 조회
    fields:
      id: { type: uuid, required: true }
      line_id: { type: uuid, required: true, ref: stenography_lines }
      editor_id: { type: uuid, nullable: true, ref: users }
      editor_name: { type: string, required: true }
      field_changed: { type: string, enum: [text, speaker, start_ms, end_ms, paragraph] }
      old_value: { type: text, nullable: true }
      new_value: { type: text, required: true }
      created_at: { type: datetime }

  # ============================================
  # channels - 채널 정보
  # ============================================
  channels:
    description: HLS 스트리밍 채널 (18개)
    endpoints:
      - method: GET
        path: /api/channels
        description: 채널 목록
      - method: GET
        path: /api/channels/status
        description: 채널 + 방송 상태
    fields:
      id: { type: string, required: true }
      name: { type: string, required: true }
      code: { type: string, required: true }
      stream_url: { type: string, required: true }
      livestatus: { type: integer, enum: [0, 1, 2, 3, 4] }

# ============================================
# WebSocket Events
# ============================================
websocket_events:
  subtitle_created:
    description: 새 자막 생성됨
    payload:
      - subtitle: { ref: subtitles }

  meeting_status_changed:
    description: 회의 상태 변경됨
    payload:
      - meeting_id: { type: uuid }
      - status: { type: string, enum: [scheduled, live, processing, ended] }

# ============================================
# External APIs (참고용)
# ============================================
external_apis:
  ggc_stream:
    description: 경기도의회 실시간 스트림
    base_url: https://stream01.cdn.gov-ntruss.com
    endpoints:
      - path: /live/{channel}/playlist.m3u8
        description: HLS 스트림

  ggc_vod:
    description: 경기도의회 VOD
    base_url: https://kms.ggc.go.kr
    endpoints:
      - path: /mp4/{filename}
        description: VOD MP4 파일

  openai_whisper:
    description: OpenAI Whisper API
    base_url: https://api.openai.com/v1
    endpoints:
      - path: /audio/transcriptions
        description: 음성-텍스트 변환
